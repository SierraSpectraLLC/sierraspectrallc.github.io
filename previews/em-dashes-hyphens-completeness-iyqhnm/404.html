<!DOCTYPE html>

<head>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --coral:   #E8756A;
            --navy:    #1e2035;
            --blue:    #7BAFD4;
            --blue-dk: #5A94BC;
            --slate:   #64748b;
            --border:  #e2e8f0;
            --white:   #ffffff;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 16px;
            line-height: 1.7;
            color: var(--navy);
            background: linear-gradient(135deg, #1e2035 0%, #2a3a5a 55%, #3a5878 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .card {
            background: var(--white);
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
            max-width: 560px;
            width: 100%;
            padding: 2.75rem 2.25rem 2.25rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 5px;
            background: linear-gradient(to right, #E8756A, #E8A370, #C5D44A, #7BAFD4, #9B8EB8);
        }

        .logo { height: 38px; width: auto; margin-bottom: 1.5rem; }

        .code {
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--coral);
            margin-bottom: 0.5rem;
        }

        h1 { font-size: 1.5rem; font-weight: 700; line-height: 1.25; margin-bottom: 0.75rem; }

        .lede { font-size: 0.95rem; color: var(--slate); margin-bottom: 1.75rem; }

        .links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1.75rem;
        }

        .links a {
            border: 1px solid var(--border);
            border-radius: 9999px;
            padding: 0.35rem 1rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--blue-dk);
            text-decoration: none;
            transition: border-color 0.15s;
        }

        .links a:hover { border-color: var(--blue); }

        .btn {
            display: inline-block;
            background: var(--coral);
            border: 2px solid var(--coral);
            color: var(--white);
            font-size: 0.9rem;
            font-weight: 600;
            padding: 0.7rem 1.75rem;
            border-radius: 6px;
            text-decoration: none;
            transition: background 0.2s, border-color 0.2s;
        }

        .btn:hover { background: #c95c52; border-color: #c95c52; }

        .phone { margin-top: 1.5rem; font-size: 0.85rem; color: var(--slate); }
        .phone a { color: var(--navy); font-weight: 600; text-decoration: none; }
        .phone a:hover { color: var(--blue-dk); }

        a:focus-visible {
            outline: 3px solid var(--blue);
            outline-offset: 2px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <main class="card">
        <img src="/assets/SSLogo_FullColor.png" alt="Sierra Spectra LLC" class="logo" width="202" height="139">

        <div class="code">Error 404</div>
        <h1>We couldn't find that page.</h1>
        <p class="lede">The link may be out of date, or the address may have a typo. Here's where most people are headed:</p>

        <div class="links">
            <a href="/#services">Services</a>
            <a href="/#platforms">Platforms</a>
            <a href="/#about">About</a>
            <a href="/#faq">FAQ</a>
            <a href="/#contact">Contact</a>
        </div>

        <a href="/" class="btn">Go to the home page</a>

        <p class="phone">Or just call us: <a href="tel:+18335743772">(833) 574-3772</a></p>
    </main>

</body>
</html>
