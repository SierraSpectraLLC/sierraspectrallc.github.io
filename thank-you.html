<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thanks - we received your request | Sierra Spectra LLC</title>
    <meta name="description" content="Your service request has been received. Sierra Spectra will respond within one business day.">
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#1e2035">

    <link rel="icon" href="assets/logo-mark.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="assets/SSLogo_FullColor_NoText.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --coral:   #E8756A;
            --navy:    #1e2035;
            --blue:    #7BAFD4;
            --blue-dk: #5A94BC;
            --slate:   #64748b;
            --border:  #e2e8f0;
            --white:   #ffffff;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 16px;
            line-height: 1.7;
            color: var(--navy);
            background: linear-gradient(135deg, #1e2035 0%, #2a3a5a 55%, #3a5878 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .card {
            background: var(--white);
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
            max-width: 520px;
            width: 100%;
            padding: 2.75rem 2.25rem 2.25rem;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 5px;
            background: linear-gradient(to right, #E8756A, #E8A370, #C5D44A, #7BAFD4, #9B8EB8);
        }

        .check {
            width: 62px;
            height: 62px;
            margin: 0 auto 1.25rem;
            border-radius: 50%;
            background: #eef7e6;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .check svg { width: 30px; height: 30px; stroke: #6d9c2f; }

        h1 { font-size: 1.5rem; font-weight: 700; line-height: 1.25; margin-bottom: 0.75rem; }

        .lede { font-size: 0.95rem; color: var(--slate); margin-bottom: 1.5rem; }

        .urgent {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem 1.1rem;
            font-size: 0.9rem;
            color: var(--slate);
            margin-bottom: 1.75rem;
        }

        .urgent a { color: var(--coral); font-weight: 600; text-decoration: none; }
        .urgent a:hover { text-decoration: underline; }

        .btn {
            display: inline-block;
            background: var(--coral);
            border: 2px solid var(--coral);
            color: var(--white);
            font-size: 0.9rem;
            font-weight: 600;
            padding: 0.7rem 1.75rem;
            border-radius: 6px;
            text-decoration: none;
            transition: background 0.2s, border-color 0.2s;
        }

        .btn:hover { background: #c95c52; border-color: #c95c52; }

        .logo { height: 38px; width: auto; margin-bottom: 1.5rem; }

        a:focus-visible {
            outline: 3px solid var(--blue);
            outline-offset: 2px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <!--
      This page exists so that visitors with JavaScript disabled are not dumped
      onto formspree.io after submitting the form. It is the target of the
      hidden _next field in the contact form on the home page.

      Visitors with JavaScript enabled never see it: the form submits in place
      and shows an inline confirmation instead.
    -->

    <main class="card">
        <img src="assets/SSLogo_FullColor.png" alt="Sierra Spectra LLC" class="logo" width="202" height="139">

        <div class="check">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M20 6L9 17l-5-5"/>
            </svg>
        </div>

        <h1>Thanks - your request is in.</h1>
        <p class="lede">We've received your message and will get back to you within one business day.</p>

        <div class="urgent">
            Instrument down right now? Call <a href="tel:+18335743772">(833) 574-3772</a> and we'll get an engineer on it.
        </div>

        <a href="index.html" class="btn">Back to sierraspectra.com</a>
    </main>

</body>
</html>
